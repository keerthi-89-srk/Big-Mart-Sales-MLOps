name: Big Mart MLOps CI

on:
  push:
    branches: [main, master]
    paths:
      - "config/lab7_quality_gate.json"
      - "config/lab8_model_lifecycle.json"
      - "src/mlops_pipeline/**"
      - "api/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-api-test.txt"
      - "Dockerfile"
      - "deploy_lab11.ps1"
      - ".github/workflows/lab8_ci.yml"
  pull_request:
    paths:
      - "config/lab7_quality_gate.json"
      - "config/lab8_model_lifecycle.json"
      - "src/mlops_pipeline/**"
      - "api/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-api-test.txt"
      - "Dockerfile"
      - "deploy_lab11.ps1"
      - ".github/workflows/lab8_ci.yml"
  workflow_dispatch:

jobs:
  quality-and-lifecycle-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt -r requirements-api-test.txt

      - name: Run portable tests without local model or dataset artifacts
        run: >-
          python -m pytest -q
          tests/test_lab12_lab13_unit.py
          tests/test_quality_gate.py
          tests/test_model_lifecycle.py
          tests/test_failure_recovery.py
          tests/test_preprocess.py
          tests/test_api.py
          tests/test_performance.py

      - name: Validate Python syntax
        run: >-
          python -m compileall -q
          api
          src/mlops_pipeline
          tests/test_lab12_lab13_unit.py
